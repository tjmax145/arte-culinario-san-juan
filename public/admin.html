<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Administración | Arte Culinario
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>


<body>

<header>

  <a
    class="logo"
    href="/"
  >
    Arte<span>Culinario</span>
  </a>

  <nav>

    <a href="/">
      Ver sitio
    </a>

    <button
      id="logout"
      hidden
    >
      Salir
    </button>

  </nav>

</header>


<main class="admin">


<section
  id="loginBox"
  class="panel"
>

  <p class="eyebrow">
    Área privada
  </p>

  <h1>
    Administrar recetas
  </h1>


  <form id="login">

    <input
      name="username"
      placeholder="Usuario"
      autocomplete="username"
      required
    >


    <input
      name="password"
      type="password"
      placeholder="Contraseña"
      autocomplete="current-password"
      required
    >


    <button
      class="button"
      type="submit"
    >
      Ingresar
    </button>


    <p
      id="loginError"
      class="error"
    ></p>

  </form>

</section>


<section
  id="dashboard"
  hidden
>


<div class="admin-head">

  <div>

    <p class="eyebrow">
      Panel de administración
    </p>

    <h1>
      Mis recetas
    </h1>

  </div>


  <button
    class="button"
    id="newRecipe"
  >
    + Nueva receta
  </button>

</div>


<div
  id="adminList"
  class="admin-list"
></div>


<section
  id="editor"
  class="panel"
  hidden
>

  <h2 id="editorTitle">
    Nueva receta
  </h2>


  <form
    id="recipeForm"
    enctype="multipart/form-data"
  >


    <input
      type="hidden"
      name="id"
    >


    <label>

      Título

      <input
        name="title"
        required
      >

    </label>


    <label>

      Descripción breve

      <textarea
        name="description"
        rows="3"
        placeholder="Contá brevemente de qué trata esta receta."
      ></textarea>

    </label>


    <div class="two">

      <label>

        Tiempo

        <input
          name="time"
          placeholder="Ej.: 45 minutos"
        >

      </label>


      <label>

        Dificultad

        <input
          name="difficulty"
          placeholder="Ej.: Fácil"
        >

      </label>

    </div>


    <label>

      Fotografía

      <input
        name="image"
        type="file"
        accept="image/jpeg,image/png,image/webp"
      >

    </label>


    <label>

      Ingredientes

      <textarea
        name="ingredients"
        rows="8"
        required
        placeholder="Escribí los ingredientes, uno por línea."
      ></textarea>

    </label>


    <label>

      Preparación

      <textarea
        name="instructions"
        rows="12"
        required
        placeholder="Escribí los pasos de preparación, uno por línea."
      ></textarea>

    </label>


    <div class="actions">

      <button
        class="button"
        type="submit"
      >
        Guardar receta
      </button>


      <button
        type="button"
        id="cancel"
      >
        Cancelar
      </button>

    </div>


    <p id="formMsg"></p>

  </form>

</section>


</section>

</main>


<script>

const loginBox =
  document.querySelector("#loginBox");

const dashboard =
  document.querySelector("#dashboard");

const login =
  document.querySelector("#login");

const editor =
  document.querySelector("#editor");

const form =
  document.querySelector("#recipeForm");

const list =
  document.querySelector("#adminList");

const message =
  document.querySelector("#formMsg");

const logout =
  document.querySelector("#logout");


let recipes = [];


function escapeHtml(text) {

  return String(text || "")
    .replace(/[&<>"']/g, character => {

      const entities = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      };

      return entities[character];

    });

}


async function checkSession() {
  try {
    const response = await fetch("/api/me", {
      credentials: "same-origin"
    });

    const data = await response.json();

    console.log("SESION DESDE /api/me:", data);

    loginBox.hidden = data.authenticated;
    dashboard.hidden = !data.authenticated;
    logout.hidden = !data.authenticated;

    if (data.authenticated) {
      loadRecipes();
    }
  } catch (error) {
    console.error("Error comprobando sesión:", error);
  }
}


async function loadRecipes() {

  const response =
    await fetch("/api/recipes");

  recipes =
    await response.json();


  if (recipes.length === 0) {

    list.innerHTML = `

      <p class="empty">

        Todavía no tenés
        recetas publicadas.

      </p>

    `;

    return;

  }


  list.innerHTML =
    recipes.map(recipe => `

      <article>

        <div>

          <h3>
            ${escapeHtml(recipe.title)}
          </h3>

          <p>
            ${escapeHtml(
              recipe.description
            )}
          </p>

        </div>


        <div>

          <button
            onclick="editRecipe('${recipe.id}')"
          >
            Editar
          </button>


          <button
            class="danger"
            onclick="deleteRecipe('${recipe.id}')"
          >
            Eliminar
          </button>

        </div>

      </article>

    `).join("");

}


login.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const data =
      Object.fromEntries(
        new FormData(login)
      );


    const response =
      await fetch(
        "/api/login",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(data)
        }
      );


    if (response.ok) {

      login.reset();

      checkSession();

    } else {

      document.querySelector(
        "#loginError"
      ).textContent =
        "Usuario o contraseña incorrectos.";

    }

  }
);


logout.addEventListener(
  "click",
  async () => {

    await fetch(
      "/api/logout",
      {
        method: "POST"
      }
    );

    window.location.reload();

  }
);


document.querySelector(
  "#newRecipe"
).addEventListener(
  "click",
  () => {

    form.reset();

    form.elements.id.value = "";

    document.querySelector(
      "#editorTitle"
    ).textContent =
      "Nueva receta";

    message.textContent = "";

    editor.hidden = false;

    editor.scrollIntoView({
      behavior: "smooth"
    });

  }
);


document.querySelector(
  "#cancel"
).addEventListener(
  "click",
  () => {

    editor.hidden = true;

  }
);


window.editRecipe =
  function(id) {

    const recipe =
      recipes.find(
        item => item.id === id
      );


    if (!recipe) return;


    form.elements.id.value =
      recipe.id;


    form.elements.title.value =
      recipe.title || "";


    form.elements.description.value =
      recipe.description || "";


    form.elements.time.value =
      recipe.time || "";


    form.elements.difficulty.value =
      recipe.difficulty || "";


    form.elements.ingredients.value =
      recipe.ingredients || "";


    form.elements.instructions.value =
      recipe.instructions || "";


    document.querySelector(
      "#editorTitle"
    ).textContent =
      "Editar receta";


    editor.hidden = false;

    editor.scrollIntoView({
      behavior: "smooth"
    });

  };


window.deleteRecipe =
  async function(id) {

    const confirmed =
      window.confirm(
        "¿Seguro que querés eliminar esta receta?"
      );


    if (!confirmed) return;


    const response =
      await fetch(
        "/api/recipes/" + id,
        {
          method: "DELETE"
        }
      );


    if (response.ok) {

      loadRecipes();

    }

  };


form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    message.textContent =
      "Guardando...";


    const id =
      form.elements.id.value;


    const data =
      new FormData(form);


    const response =
      await fetch(
        "/api/recipes" +
        (id ? "/" + id : ""),
        {
          method:
            id ? "PUT" : "POST",

          body: data
        }
      );


    if (response.ok) {

      message.textContent =
        "Receta guardada correctamente.";

      form.reset();

      form.elements.id.value = "";

      editor.hidden = true;

      loadRecipes();

    } else {

      const result =
        await response.json();

      message.textContent =
        result.error ||
        "No se pudo guardar la receta.";

    }

  }
);


checkSession();

</script>

</body>

</html>
